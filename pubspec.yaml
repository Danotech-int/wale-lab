name: excelerate_talent_hub
description: Private talent development and recruitment platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.7
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_auth_mocks: ^0.16.0
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/
